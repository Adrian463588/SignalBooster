name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify No Internal Docs or Reference Projects in Repository
        run: |
          echo "Checking for forbidden internal docs and reference projects..."
          FORBIDDEN_FOUND=0
          if [ -d "docs" ] && [ "$(find docs -name '*.md' 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "::error::Internal docs directory contains markdown files in repository!"
            FORBIDDEN_FOUND=1
          fi
          if [ -d "porjectreferences" ] || [ -d "projectreferences" ]; then
            echo "::error::Reference project directories found in repository!"
            FORBIDDEN_FOUND=1
          fi
          if [ "$FORBIDDEN_FOUND" -ne 0 ]; then
            echo "Failing CI due to DevSecOps policy violation."
            exit 1
          fi
          echo "Repository cleanliness & data leakage check passed."

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build-and-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Tests, Lint & Build Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload Test Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
